name: F-Insight legacy native-origin iOS preflight (unsigned)

on:
  pull_request:
    paths:
      - 'app/**'
      - 'assets/**'
      - 'lib/**'
      - 'app.json'
      - 'app.config.js'
      - 'package.json'
      - '.github/workflows/ios-origin-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expo-ios-configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: '1'
      EXPO_PUBLIC_ENV: ios-preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install legacy Expo SDK 50 dependencies without modifying source
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Check active Expo config and record legacy incompatibility
        shell: bash
        run: |
          set -euo pipefail
          if npx expo config --type public --json > /tmp/finsight-expo-config.json 2> /tmp/finsight-expo-config-error.txt; then
            echo "Active Expo config parsed."
          else
            echo "WARNING: active app.config.js failed to parse on Expo 50; testing app.json fallback ONLY, without modifying source."
            cat /tmp/finsight-expo-config-error.txt || true
            mv app.config.js "$RUNNER_TEMP/finsight-app.config.js.bak"
            npx expo config --type public --json > /tmp/finsight-expo-config.json
            echo "Fallback app.json valid. Original active app.config.js still requires separate remediation."
          fi
          node -e 'const c=require("/tmp/finsight-expo-config.json");if(c.ios?.bundleIdentifier!=="org.finsight.mobile"||c.android?.package!=="org.finsight.mobile"){console.error("Unexpected ids in fallback/active Expo config");process.exit(1)}console.log("legacy source IDs: "+c.ios.bundleIdentifier)'
      - name: Export offline iOS JavaScript bundle
        run: npx expo export --platform ios --output-dir dist-ios-preflight
      - name: Archive diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finsight-legacy-ios-config
          path: |
            /tmp/finsight-expo-config.json
            /tmp/finsight-expo-config-error.txt
          if-no-files-found: ignore
          retention-days: 7

  native-ios-simulator:
    needs: expo-ios-configuration
    runs-on: macos-15
    timeout-minutes: 65
    env:
      CI: '1'
      EXPO_PUBLIC_ENV: ios-preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install legacy dependencies in disposable runner
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Resolve active Expo configuration
        shell: bash
        run: |
          set -euo pipefail
          if ! npx expo config --type public --json >/tmp/finsight-native-config.json 2>/tmp/finsight-native-config-errors.txt; then
            echo "Legacy dynamic config not loadable here; using app.json only for this ephemeral diagnostic build."
            mv app.config.js "$RUNNER_TEMP/finsight-app.config.js.bak"
            npx expo config --type public --json >/tmp/finsight-native-config.json
          fi
          node -e 'const c=require("/tmp/finsight-native-config.json");if(c.ios?.bundleIdentifier!=="org.finsight.mobile"){process.exit(1)}'
      - name: Generate unsigned native project from legacy source
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
      - name: Compile legacy iOS simulator without certificates
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -type d | head -1)"
          test -n "$WORKSPACE"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -derivedDataPath "$RUNNER_TEMP/finsight-native-ios" build 2>&1 | tee ios-native-build.log
      - name: Archive native build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finsight-legacy-native-ios-diagnostics
          path: |
            ios-native-build.log
            /tmp/finsight-native-config-errors.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Archive unsigned simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: finsight-legacy-unsigned-simulator
          path: ${{ runner.temp }}/finsight-native-ios/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 7
